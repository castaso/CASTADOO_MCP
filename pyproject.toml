[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "castadoo-mcp"
version = "1.3.2"
description = "CASTADOO MCP for AI agents - 41 tools, gated writes, multi-instance. Fork of odoo-mcp (MIT)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["odoo", "mcp", "server", "model-context-protocol", "chatgpt", "claude"]
authors = [
    {name = "CASTADOO"}
]
dependencies = [
    "mcp>=2,<3",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/castaso/CASTADOO_MCP#readme"
Source = "https://github.com/castaso/CASTADOO_MCP"
Documentation = "https://github.com/castaso/CASTADOO_MCP#readme"
Changelog = "https://github.com/castaso/CASTADOO_MCP/blob/main/CHANGELOG.md"
Issues = "https://github.com/castaso/CASTADOO_MCP/issues"
Upstream = "https://github.com/erpipe-org/mcp-odoo"

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "pytest",
    "ruff",
    "build",
    "twine",
]

[project.scripts]
castadoo-mcp = "odoo_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["odoo_mcp"]

[tool.setuptools.package-data]
odoo_mcp = ["data/*.json"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Tool modules annotate protocol-level response models (typed MCP outputSchema)
# while the functions keep returning the plain-dict envelope MCPServer validates
# at the MCP layer; the runtime dict/model mismatch is deliberate.
[[tool.mypy.overrides]]
module = [
    "odoo_mcp.tools_read",
    "odoo_mcp.tools_diagnostics",
    "odoo_mcp.tools_accounting",
    "odoo_mcp.tools_async",
    "odoo_mcp.tools_cross_instance",
    "odoo_mcp.tools_knowledge",
]
disable_error_code = ["return-value"]
